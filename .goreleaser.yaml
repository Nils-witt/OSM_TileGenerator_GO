version: 2

project_name: osm-tile-generator

builds:
  - id: osm-tile-generator
    main: ./cmd/osm-tile-generator
    binary: osm-tile-generator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Nils-witt/OSM_TileGenerator_GO/internal/version.Version={{.Version}}
      - -X github.com/Nils-witt/OSM_TileGenerator_GO/internal/version.Commit={{.ShortCommit}}
      - -X github.com/Nils-witt/OSM_TileGenerator_GO/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^ci", "^chore", "^style"]

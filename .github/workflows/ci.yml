name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Minimum version from go.mod, plus the latest release.
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify modules
        run: go mod verify

      - name: Check go mod tidy
        if: matrix.go == 'stable'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # Report only issues introduced by the change until the existing
          # errcheck findings are fixed.
          only-new-issues: true

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
